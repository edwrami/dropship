<div class="share" data-share
     data-title="{{ titulo_share }}"
     data-text="{{ texto_share }}"
     data-url="{{ url_share }}"
     data-price="{{ precio_share|default:'' }}"
     data-kicker="{{ kicker_share|default:'ERA shop' }}">
  <button type="button" class="btn" data-kind="estado">Publicar en estados</button>
  <a class="btn sec" data-net="whatsapp" target="_blank" rel="noopener">WhatsApp</a>
  <a class="btn sec" data-net="facebook" target="_blank" rel="noopener">Facebook</a>
  <button type="button" class="btn sec" data-kind="copiar">Copiar enlace</button>
</div>
