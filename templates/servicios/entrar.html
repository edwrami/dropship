{% extends "base.html" %}
{% block title %}Entrar a servicios · ERA shop{% endblock %}
{% block content %}
<h2>Entrar como oferente</h2>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" style="max-width:420px">{% csrf_token %}
  <label>Correo</label>
  <input type="email" name="email" required>
  <label>Contraseña</label>
  <input type="password" name="password" required>
  <button class="btn" type="submit">Entrar</button>
</form>
<p class="muted">¿Aún no ofreces servicio? <a href="{% url 'registro_oferente' %}">Regístrate</a>.</p>
{% endblock %}
